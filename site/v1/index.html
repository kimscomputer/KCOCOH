<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCOC — Korean Church of Columbus</title>
  <meta name="description" content="Korean Church of Columbus 새 웹사이트 준비 페이지입니다.">
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --brand:#2563eb; --bg:#f8fafc; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:var(--ink); background:var(--bg); }
    main { min-height:100vh; display:grid; place-items:center; padding:32px; }
    .card { max-width:880px; width:100%; background:white; border:1px solid #e2e8f0; border-radius:28px; padding:clamp(28px,5vw,64px); box-shadow:0 24px 80px rgba(15,23,42,.10); }
    .eyebrow { color:var(--brand); font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:13px; }
    h1 { font-size:clamp(40px,8vw,82px); line-height:.95; margin:18px 0; letter-spacing:-.055em; }
    p { font-size:clamp(17px,2.2vw,22px); line-height:1.7; color:var(--muted); margin:0 0 26px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px; border-radius:999px; text-decoration:none; font-weight:800; }
    .primary { background:var(--brand); color:white; }
    .secondary { background:#eff6ff; color:#1d4ed8; }
    footer { margin-top:34px; color:#94a3b8; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow">KCOC Website Project</div>
      <h1 id="title">Korean Church of Columbus</h1>
      <p>콜럼버스 한인교회 새 웹사이트를 준비하고 있습니다. 예배 시간, 새가족 안내, 다음세대, 영어부, 한글학교, 말씀과 소식을 한곳에서 쉽게 볼 수 있도록 구성할 예정입니다.</p>
      <div class="actions">
        <a class="btn primary" href="mailto:help@mykoreanchurch.org">문의하기</a>
        <a class="btn secondary" href="https://www.mykoreanchurch.org/">기존 사이트 보기</a>
      </div>
      <footer>Working domain: kcocoh.org</footer>
    </section>
  </main>
</body>
</html>
